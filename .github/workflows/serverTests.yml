name: Server Node Tests

on:
  push:
    branches: ["main"]
    paths:
      - "server-app/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: ["main"]
    paths:
      - "server-app/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Server App Node Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./server-app
        run: |
          set -o pipefail
          npx --yes c8 \
            --reporter=lcov \
            --reporter=text \
            node --experimental-vm-modules \
                 --experimental-test-module-mocks \
                 --test \
                 --test-reporter=spec 2>&1 | tee /tmp/test-output.txt
        env:
          NODE_ENV: test

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ./server-app/coverage/lcov.info
          flag-name: server

      - name: Write coverage to job summary
        if: always()
        run: |
          echo "## Server Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '/start of coverage report/{found=1; next} /end of coverage report/{exit} found{print}' \
            /tmp/test-output.txt >> "$GITHUB_STEP_SUMMARY" \
            || echo "Coverage data not available" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-output
          path: /tmp/test-output.txt
          retention-days: 14
