<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="TW Tournament App logo">
  <!-- Brass/gold chevron (lower) — darker shade for light backgrounds -->
  <polyline points="8,80 50,44 92,80"
    fill="none" stroke="#946B0C" stroke-width="14"
    stroke-linejoin="miter" stroke-linecap="butt"/>
  <!-- Crimson chevron (upper) -->
  <polyline points="8,62 50,26 92,62"
    fill="none" stroke="#A11D22" stroke-width="14"
    stroke-linejoin="miter" stroke-linecap="butt"/>
</svg>
