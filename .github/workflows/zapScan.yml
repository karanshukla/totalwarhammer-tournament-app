name: OWASP ZAP Security Scan

on:
  push:
    branches: ["main"]
    paths:
      - "server-app/**"
      - "client-app/**"
      - "docker-compose.yml"
      - "docker/server/Dockerfile"
      - "docker/client/Dockerfile"
      - "caddy/**"
      - ".github/openapi.yml"
      - ".github/workflows/zapScan.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "server-app/**"
      - "client-app/**"
      - "docker-compose.yml"
      - "docker/server/Dockerfile"
      - "docker/client/Dockerfile"
      - "caddy/**"
      - ".github/openapi.yml"
      - ".github/workflows/zapScan.yml"

permissions:
  contents: read
  issues: write

jobs:
  zap-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for Docker Compose
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET != '' && secrets.SESSION_SECRET || 'ci-session-secret-zap' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET != '' && secrets.CSRF_SECRET || 'ci-csrf-secret-zap' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET != '' && secrets.JWT_SECRET || 'ci-jwt-secret-zap' }}
        run: |
          cat > .env <<EOF
          SESSION_SECRET=${SESSION_SECRET}
          CSRF_SECRET=${CSRF_SECRET}
          JWT_SECRET=${JWT_SECRET}
          RESEND_API_KEY=re_placeholder_not_used_in_scan
          CLIENT_URL=http://localhost
          BASE_URL=http://localhost
          EOF

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          echo "Waiting for Caddy + server..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ]; then
              echo "App is up (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i/40 - HTTP $STATUS, waiting..."
            sleep 3
          done
          # Verify backend API is reachable through Caddy reverse proxy
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/auth/csrf-token)
          echo "Backend API status: $API_STATUS"
          if [ "$API_STATUS" != "200" ]; then
            echo "WARNING: Backend API not returning 200 on /api/auth/csrf-token (got $API_STATUS)"
          fi

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: ".github/openapi.yml"
          format: openapi
          rules_file_name: ".github/zap-rules.tsv"
          fail_action: false
          allow_issue_writing: true
          artifact_name: zap-api-report

      - name: Stop containers
        if: always()
        run: docker compose down
