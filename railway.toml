# Railway Configuration
# This file tells Railway to use Railpack (the new native builder) instead of the Dockerfiles.

[build]
builder = "RAILPACK"

[deploy]
# Note: The start command depends on which service is being deployed.
# You can override these in the Railway Service settings (Settings -> Deploy -> Start Command).
#
# For the Server service:
# startCommand = "npm run start --workspace=server-app"
#
# For the Client service:
# startCommand = "npm run preview --workspace=client-app"
