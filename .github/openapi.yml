openapi: "3.0.3"
info:
  title: TW Tournament App API
  version: "1.0.0"
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
  schemas:
    ObjectId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      example: "507f1f77bcf86cd799439011"
    MatchPlayer:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Karl Franz
        faction:
          type: string
          description: Empty string or a known faction name
          example: Empire
        participantId:
          $ref: "#/components/schemas/ObjectId"
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/csrf-token:
    get:
      summary: Get CSRF token
      operationId: getCsrfToken
      responses:
        "200":
          description: CSRF token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                  sessionId:
                    type: string

  /auth/login:
    post:
      summary: Login with email/username and password
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: Authenticated
        "400":
          description: Validation error
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      summary: Logout (POST)
      operationId: authLogoutPost
      responses:
        "200":
          description: Logged out
    delete:
      summary: Logout (DELETE)
      operationId: authLogoutDelete
      responses:
        "200":
          description: Logged out

  /auth/token:
    post:
      summary: Exchange PKCE code for session
      operationId: authToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, code, code_verifier]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                  example: authorization_code
                code:
                  type: string
                  minLength: 10
                  example: 0123456789abcdef0123456789abcdef
                code_verifier:
                  type: string
                  minLength: 43
                  maxLength: 128
                  example: dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW1gFWFOEjXk0
      responses:
        "200":
          description: Session established
        "400":
          description: Invalid or expired code
        "401":
          description: Code verifier mismatch

  # ── User ──────────────────────────────────────────────────────────────────
  /user/register:
    post:
      summary: Register a new user account
      operationId: userRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  example: player1
                email:
                  type: string
                  example: player1@example.com
                password:
                  type: string
                  example: SecurePass1!
      responses:
        "201":
          description: Registered
        "400":
          description: Validation error
        "409":
          description: Username or email already taken

  /user/exists:
    get:
      summary: Check if a username or email is taken
      operationId: userExists
      parameters:
        - name: identifier
          in: query
          required: true
          schema:
            type: string
            example: player1
      responses:
        "200":
          description: Existence check result
        "400":
          description: Missing query param

  /user/login:
    post:
      summary: Login (user-scoped alias)
      operationId: userLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  minLength: 3
                  example: player1@example.com
                password:
                  type: string
                  example: SecurePass1!
      responses:
        "200":
          description: Authenticated
        "401":
          description: Invalid credentials

  /user/logout:
    post:
      summary: Logout (user-scoped)
      operationId: userLogout
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Logged out
        "403":
          description: CSRF validation failed

  /user/update-username:
    post:
      summary: Update username (authenticated)
      operationId: updateUsername
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: "^[a-zA-Z0-9_-]+$"
                  example: player1
      responses:
        "200":
          description: Username updated
        "401":
          description: Not authenticated
        "409":
          description: Username taken

  /user/update-password:
    post:
      summary: Update password (authenticated)
      operationId: updatePassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword:
                  type: string
                  example: SecurePass1!
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
                  example: SecurePass2!
                confirmPassword:
                  type: string
                  description: Must equal newPassword
                  example: SecurePass2!
      responses:
        "200":
          description: Password updated
        "401":
          description: Not authenticated or wrong current password

  /user/account:
    delete:
      summary: Delete own account (authenticated)
      operationId: deleteAccount
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Account deleted
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed

  /user/stats:
    get:
      summary: Get stats for authenticated user
      operationId: getUserStats
      security:
        - sessionCookie: []
      parameters:
        - name: range
          in: query
          required: false
          description: Time window applied to win-based aggregates
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            example: all
        - name: limit
          in: query
          required: false
          description: Rows per list section; omit for the default per-section caps
          schema:
            type: integer
            minimum: 1
            maximum: 200
            example: 10
        - name: offset
          in: query
          required: false
          description: Rows to skip in every list section
          schema:
            type: integer
            minimum: 0
            maximum: 200
            example: 0
        - name: detail
          in: query
          required: false
          description: full adds the per-faction win split
          schema:
            type: string
            enum: [summary, full]
            example: summary
      responses:
        "200":
          description: User stats
        "401":
          description: Not authenticated

  # ── Guest ─────────────────────────────────────────────────────────────────
  /guest:
    post:
      summary: Create a guest session
      operationId: createGuest
      responses:
        "201":
          description: Guest created
        "200":
          description: Guest session already exists

  /guest/username:
    post:
      summary: Set guest username
      operationId: updateGuestUsername
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: "^[a-zA-Z0-9_-]+$"
                  example: player1
      responses:
        "200":
          description: Username set
        "401":
          description: Not a guest session

  # ── Password Reset ─────────────────────────────────────────────────────────
  /password-reset/request:
    post:
      summary: Request a password reset email
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: player1@example.com
      responses:
        "200":
          description: Reset email sent (or silently ignored if not found)
        "400":
          description: Validation error

  /password-reset/verify:
    post:
      summary: Verify a password reset token
      operationId: verifyResetToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 20
                  example: 0123456789abcdef0123456789abcdef
      responses:
        "200":
          description: Token valid
        "400":
          description: Invalid or expired token

  /password-reset/reset:
    post:
      summary: Reset password using a valid token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  minLength: 20
                  example: 0123456789abcdef0123456789abcdef
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
                  example: SecurePass2!
      responses:
        "200":
          description: Password reset
        "400":
          description: Invalid or expired token

  # ── Tournament ─────────────────────────────────────────────────────────────
  /tournament:
    get:
      summary: List all public tournaments
      operationId: getTournaments
      parameters:
        - name: status
          in: query
          required: false
          description: Comma-separated subset of pending, active, completed
          schema:
            type: string
            example: pending,active
      responses:
        "200":
          description: List of tournaments
    post:
      summary: Create a tournament (authenticated)
      operationId: createTournament
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, playerCount, tournamentType]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: Damnos Campaign
                playerCount:
                  type: integer
                  minimum: 2
                  maximum: 128
                  example: 8
                tournamentType:
                  type: string
                  enum:
                    - Single Elimination
                    - Double Elimination
                    - Round Robin
                    - Swiss System
                  example: Single Elimination
                description:
                  type: string
                  maxLength: 2000
                  example: Six commanders, five rounds, everyone plays everyone.
                enable40kFactions:
                  type: boolean
                  example: false
                bannedFactions:
                  type: array
                  description: Must be factions of the tournament's game system
                  items:
                    type: string
                  example: [Empire]
      responses:
        "201":
          description: Tournament created
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed or guest user

  /tournament/mine:
    get:
      summary: Get tournaments created by the authenticated user
      operationId: getUserTournaments
      security:
        - sessionCookie: []
      responses:
        "200":
          description: User's tournaments
        "401":
          description: Not authenticated

  /tournament/code/{code}:
    get:
      summary: Get tournament by join code
      operationId: getTournamentByCode
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z0-9]{1,12}$"
            example: W5NE4F
      responses:
        "200":
          description: Tournament data
        "404":
          description: Not found

  /tournament/{id}:
    get:
      summary: Get tournament by ID
      operationId: getTournamentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Tournament data
        "404":
          description: Not found
    delete:
      summary: Delete tournament (authenticated, creator only)
      operationId: deleteTournament
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Deleted
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed or not the creator
        "404":
          description: Not found

  /tournament/{id}/participants:
    post:
      summary: Add participant (authenticated)
      operationId: addParticipant
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Karl Franz
                faction:
                  type: string
                  description: Empty string or a known faction name
                  example: Empire
      responses:
        "200":
          description: Participant added
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed

  /tournament/{id}/participants/{participantId}:
    patch:
      summary: Update participant (authenticated, creator only)
      operationId: updateParticipant
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
        - name: participantId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Karl Franz
                faction:
                  type: string
                  description: Empty string or a known faction name
                  example: Empire
      responses:
        "200":
          description: Participant updated
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed or not the creator
        "404":
          description: Tournament or participant not found
    delete:
      summary: Remove participant (authenticated)
      operationId: removeParticipant
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
        - name: participantId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Participant removed
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed

  /tournament/{id}/join:
    post:
      summary: Join a tournament (authenticated)
      operationId: joinTournament
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                faction:
                  type: string
                  description: Empty string or a known faction name
                  example: Empire
      responses:
        "200":
          description: Joined
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed
        "404":
          description: Not found

  /tournament/{id}/start:
    post:
      summary: Start a tournament (authenticated, creator only)
      operationId: startTournament
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Started
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed or not the creator

  /tournament/{id}/advance:
    post:
      summary: Advance tournament round (authenticated, creator only)
      operationId: advanceRound
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Round advanced
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed

  /tournament/{id}/description:
    patch:
      summary: Update tournament description (authenticated)
      operationId: updateDescription
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                  maxLength: 2000
                  example: Six commanders, five rounds, everyone plays everyone.
      responses:
        "200":
          description: Description updated
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed

  # ── Match ─────────────────────────────────────────────────────────────────
  /match/tournament/{tournamentId}:
    get:
      summary: Get all matches for a tournament
      operationId: getMatchesByTournament
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: List of matches
        "404":
          description: Tournament not found

  /match/{id}:
    get:
      summary: Get a match by ID
      operationId: getMatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Match data
        "404":
          description: Not found

  /match:
    post:
      summary: Create a match (authenticated)
      operationId: createMatch
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tournamentId, round, matchNumber, player1, player2]
              properties:
                tournamentId:
                  $ref: "#/components/schemas/ObjectId"
                round:
                  type: integer
                  minimum: 1
                  maximum: 64
                  example: 1
                matchNumber:
                  type: integer
                  minimum: 1
                  maximum: 512
                  example: 1
                player1:
                  $ref: "#/components/schemas/MatchPlayer"
                player2:
                  $ref: "#/components/schemas/MatchPlayer"
      responses:
        "201":
          description: Match created
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed

  /match/{id}/report:
    patch:
      summary: Report match result (authenticated participant)
      operationId: reportResult
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winnerId]
              properties:
                winnerId:
                  $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Result reported
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed or not a participant

  /match/{id}/result:
    patch:
      summary: Record match result (authenticated, creator only)
      operationId: recordResult
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winnerId]
              properties:
                winnerId:
                  $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Result recorded
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed or not the creator

  /match/{id}/resolve:
    patch:
      summary: Resolve a disputed match (authenticated, creator)
      operationId: resolveDispute
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winnerId]
              properties:
                winnerId:
                  $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Dispute resolved
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed or not the tournament creator

  /match/{id}/override:
    patch:
      summary: Override match result (authenticated, creator)
      operationId: overrideResult
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winnerId]
              properties:
                winnerId:
                  $ref: "#/components/schemas/ObjectId"
                reason:
                  type: string
                  maxLength: 500
                  example: Both players agreed the reported result was wrong
      responses:
        "200":
          description: Result overridden
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed or not the creator

  /match/{id}/status:
    patch:
      summary: Update match status (authenticated)
      operationId: updateMatchStatus
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, in_progress]
                  example: in_progress
      responses:
        "200":
          description: Status updated
        "401":
          description: Not authenticated
        "403":
          description: CSRF validation failed

  # ── Stats ──────────────────────────────────────────────────────────────────
  /stats:
    get:
      summary: Get global app statistics
      operationId: getStats
      parameters:
        - name: range
          in: query
          required: false
          description: Time window applied to win-based aggregates
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            example: all
        - name: limit
          in: query
          required: false
          description: Rows per list section; omit for the default per-section caps
          schema:
            type: integer
            minimum: 1
            maximum: 200
            example: 10
        - name: offset
          in: query
          required: false
          description: Rows to skip in every list section
          schema:
            type: integer
            minimum: 0
            maximum: 200
            example: 0
      responses:
        "200":
          description: Global stats
