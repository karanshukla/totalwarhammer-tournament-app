name: Server Node Tests

on:
  push:
    branches: ["main"]
    paths:
      - "server-app/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: ["main"]
    paths:
      - "server-app/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  test:
    name: Run Server App Node Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: ./server-app
        run: npm test
        env:
          NODE_ENV: test

      - name: Report coverage (informational)
        working-directory: ./server-app
        run: node --experimental-vm-modules --experimental-test-module-mocks --experimental-test-coverage --test 2>&1 | tee coverage-report.txt || true
        continue-on-error: true
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: ./server-app/coverage-report.txt
          retention-days: 14
