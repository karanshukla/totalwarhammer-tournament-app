name: Client Vitest Tests

on:
  push:
    branches: ["main"]
    paths:
      - "client-app/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
  pull_request:
    branches: ["main"]
    paths:
      - "client-app/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Client App Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Bun is used as the installer (drop-in for `npm ci`); Node remains
      # the runtime for the build/test scripts below. See issue #193.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: ./client-app
        run: npm test

      - name: Run coverage
        working-directory: ./client-app
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text --coverage.reporter=json-summary
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: ./client-app/coverage/
          retention-days: 14
