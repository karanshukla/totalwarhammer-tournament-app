name: Playwright E2E Tests

on:
  push:
    branches: ["main"]
    paths:
      - "client-app/**"
      - "server-app/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - "docker/**"
      - "caddy/**"
      - ".github/workflows/e2eTests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "client-app/**"
      - "server-app/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - "docker/**"
      - "caddy/**"
      - ".github/workflows/e2eTests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Type-check the E2E suite
        run: npm run test:e2e:typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Secrets fall back to throwaway CI values when not configured.
      # These are only used for the test DB — no real data is at risk.
      - name: Create .env for Docker Compose
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET != '' && secrets.SESSION_SECRET || 'ci-session-secret-e2e' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET != '' && secrets.CSRF_SECRET || 'ci-csrf-secret-e2e' }}
        run: |
          cat > .env <<EOF
          SESSION_SECRET=${SESSION_SECRET}
          CSRF_SECRET=${CSRF_SECRET}
          RESEND_API_KEY=re_placeholder_not_used_in_tests
          CLIENT_URL=http://localhost:8080
          BASE_URL=http://localhost:8080
          EOF

      - name: Build and start app stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for the stack to be ready
        run: |
          echo "Waiting for the app to accept requests..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/auth/csrf-token 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Stack ready (HTTP $STATUS) after $i attempt(s)"
              exit 0
            fi
            echo "Attempt $i/40 — HTTP $STATUS, retrying in 3 s..."
            sleep 3
          done
          echo "Stack never became ready" >&2
          exit 1

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Dump container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: tests/e2e/test-results/
          retention-days: 14

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --volumes --remove-orphans
