name: Client Vitest Tests

on:
  push:
    branches: ["main"]
    paths:
      - "client-app/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: ["main"]
    paths:
      - "client-app/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Client App Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: ./client-app
        run: npm test

      - name: Run coverage
        working-directory: ./client-app
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text --coverage.reporter=json-summary

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: ./client-app/coverage/
          retention-days: 14
