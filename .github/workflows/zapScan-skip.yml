name: OWASP ZAP Security Scan

# Companion stub for zapScan.yml.
#
# zapScan.yml is path-filtered, so it does not run on pull requests that
# touch none of its paths. Its jobs are required status checks, and a required
# check that never runs leaves the PR blocked forever waiting for a result that
# is not coming -- which is what happened to CI-only and docs-only PRs.
#
# This workflow carries the inverse filter (`paths-ignore` mirrors the list in
# zapScan.yml) and reports the same job names as successful, so exactly one
# of the two runs for any given PR and the contexts are always reported.
#
# Keep the path list and job names below in sync with zapScan.yml.

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "server-app/**"
      - "client-app/**"
      - "docker-compose.yml"
      - "docker/server/Dockerfile"
      - "docker/client/Dockerfile"
      - "caddy/**"
      - ".github/openapi.yml"
      - ".github/workflows/zapScan.yml"

permissions:
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    steps:
      - run: echo "No files relevant to OWASP ZAP API Scan changed; nothing to check."
