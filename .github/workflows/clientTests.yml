name: Client Vitest Tests

on:
  push:
    branches: ["main"]
    paths:
      - "client-app/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: ["main"]
    paths:
      - "client-app/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  test:
    name: Run Client App Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: ./client-app
        run: npm test
